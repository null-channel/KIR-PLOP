apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirzop
  labels:
    app: kirzop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kirzop
  template:
    metadata:
      labels:
        app: kirzop
    spec:
      containers:
      - name: kirzop
        image: kirzop:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: sqlite-data
          mountPath: /app/test.sqlite
      volumes:
      - name: sqlite-data
        persistentVolumeClaim:
          claimName: kirzop-sqlite-pvc 
